name: Цены Google Flights

on:
  schedule:
    - cron: "0 3 * * *"   # каждый день в 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать цены
        run: python scripts/google_flights.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "rio-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/google.json
          git diff --cached --quiet || git commit -m "data: Google Flights $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push
